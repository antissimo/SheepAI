services:
  postgres:
    image: postgres:16-alpine
    container_name: sheepai_postgres
    environment:
      POSTGRES_DB: sheep_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sheep_ai"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sheepai_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./src:/app
      - ./agents:/app/agents
    ports:
      - "8000:8000"
    environment:
      TZ: Europe/Zagreb
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/sheep_ai
      SECRET_KEY: dev-secret-key-change-in-production
      CORS_ALLOW_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: sheepai_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
